services:
  mediaforge:
    environment:
      MEDIAFORGE_METRICS_AUTH_MODE: token
      MEDIAFORGE_METRICS_TOKEN_FILE: /run/secrets/mediaforge_metrics_token
    secrets:
      - source: mediaforge_metrics_token
        target: mediaforge_metrics_token
        mode: 0400

  prometheus:
    image: prom/prometheus:v3.13.0
    command:
      - /bin/sh
      - -ec
      - |
        sed "s|__MEDIAFORGE_METRICS_TARGET__|$${MEDIAFORGE_METRICS_TARGET}|g" \
          /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        exec /bin/prometheus --config.file=/tmp/prometheus.yml --storage.tsdb.path=/prometheus --web.enable-lifecycle
    environment:
      MEDIAFORGE_METRICS_TARGET: ${MEDIAFORGE_METRICS_TARGET:-mediaforge:8020}
    depends_on:
      - mediaforge
      - alertmanager
    ports:
      - "127.0.0.1:${MEDIAFORGE_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./ops/observability/prometheus/prometheus.yml.template:/etc/prometheus/prometheus.yml.template:ro
      - ./ops/observability/prometheus/rules:/etc/prometheus/rules:ro
      - mediaforge-prometheus:/prometheus
    secrets:
      - source: mediaforge_metrics_token
        target: metrics-token
        mode: 0400
    restart: unless-stopped

  alertmanager:
    image: quay.io/prometheus/alertmanager:v0.32.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "127.0.0.1:${MEDIAFORGE_ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./ops/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - mediaforge-alertmanager:/alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${MEDIAFORGE_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: ${MEDIAFORGE_GRAFANA_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:${MEDIAFORGE_GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - mediaforge-grafana:/var/lib/grafana
    secrets:
      - source: grafana_admin_password
        target: grafana_admin_password
        mode: 0400
    restart: unless-stopped

secrets:
  mediaforge_metrics_token:
    file: ${MEDIAFORGE_METRICS_TOKEN_FILE:?set MEDIAFORGE_METRICS_TOKEN_FILE to a one-line secret file}
  grafana_admin_password:
    file: ${MEDIAFORGE_GRAFANA_ADMIN_PASSWORD_FILE:?set MEDIAFORGE_GRAFANA_ADMIN_PASSWORD_FILE to a one-line secret file}

volumes:
  mediaforge-prometheus:
  mediaforge-alertmanager:
  mediaforge-grafana:
