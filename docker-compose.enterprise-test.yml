services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mediaforge_test
      POSTGRES_USER: mediaforge_test
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:15492:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediaforge_test -d mediaforge_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:16392:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: mediaforge_test
      MINIO_ROOT_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:19092:9000"
    tmpfs:
      - /data
