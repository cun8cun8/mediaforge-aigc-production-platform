apiVersion: v1
kind: Secret
metadata:
  name: mediaforge-runtime
  namespace: mediaforge
type: Opaque
stringData:
  database-url: postgresql://mediaforge:replace-me@postgres.example.internal:5432/mediaforge
  redis-url: redis://redis.example.internal:6379/0
  storage-endpoint: https://object-store.example.internal
  storage-access-key-id: replace-me-or-use-workload-identity
  storage-secret-access-key: replace-me-or-use-workload-identity
  api-keys: '{"replace-admin-token":{"subject":"operations","role":"admin"},"replace-worker-token":{"subject":"gpu-worker","role":"provider"}}'
  worker-token: replace-worker-token
  callback-secret: replace-with-a-long-random-secret
  settlement-callback-secret: replace-with-settlement-callback-secret
  stripe-settlement-webhook-secret: whsec_replace-with-stripe-endpoint-secret
  siem-bearer-token: replace-with-siem-bearer-token
  siem-signing-secret: replace-with-siem-signing-secret
  audit-anchor-bearer-token: replace-with-notary-bearer-token
  audit-anchor-signing-secret: replace-with-notary-signing-secret
  metrics-token: replace-with-a-long-random-token
  oidc-client-secret: replace-me-when-oidc-is-enabled
