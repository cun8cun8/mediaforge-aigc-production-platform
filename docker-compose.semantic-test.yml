services:
  pgvector:
    image: pgvector/pgvector:0.8.6-pg16
    environment:
      POSTGRES_DB: mediaforge_vector_test
      POSTGRES_USER: mediaforge_vector_test
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:${MEDIAFORGE_TEST_VECTOR_PORT:-15493}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediaforge_vector_test -d mediaforge_vector_test"]
      interval: 2s
      timeout: 3s
      retries: 30
